<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relógio Neon</title>
    <style>
      :root {
        --bg: #030712;
        --panel: rgba(10, 14, 24, 0.9);
        --cyan: #3be7ff;
        --blue: #5a8bff;
        --purple: #b35dff;
        --white: #ecfeff;
        --muted: #8fe7ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(59, 231, 255, 0.22), transparent 30%),
          radial-gradient(circle at bottom, rgba(179, 93, 255, 0.18), transparent 30%),
          var(--bg);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .clock {
        position: relative;
        padding: 2.2rem 3.2rem;
        border-radius: 24px;
        background: var(--panel);
        border: 1px solid rgba(59, 231, 255, 0.5);
        box-shadow:
          0 0 20px rgba(59, 231, 255, 0.4),
          0 0 50px rgba(90, 139, 255, 0.2),
          inset 0 0 25px rgba(59, 231, 255, 0.08);
        overflow: hidden;
        text-align: center;
        animation: pulseGlow 2.8s ease-in-out infinite alternate;
      }

      .clock::before,
      .clock::after {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: 18px;
        pointer-events: none;
      }

      .clock::before {
        border: 1px solid rgba(59, 231, 255, 0.38);
        box-shadow: inset 0 0 18px rgba(59, 231, 255, 0.16);
      }

      .clock::after {
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(59, 231, 255, 0.4) 50%,
          transparent 100%
        );
        transform: translateX(-120%);
        animation: sweep 4s linear infinite;
      }

      #date {
        margin: 0 0 0.6rem;
        color: var(--muted);
        font-size: 0.9rem;
        letter-spacing: 0.4rem;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(143, 231, 255, 0.9);
      }

      #time {
        margin: 0;
        color: var(--white);
        font-size: clamp(2.6rem, 7vw, 5.5rem);
        letter-spacing: 0.18em;
        font-weight: 700;
        text-shadow:
          0 0 8px rgba(255, 255, 255, 0.9),
          0 0 18px rgba(59, 231, 255, 0.8),
          0 0 30px rgba(179, 93, 255, 0.8);
        animation: flicker 2.5s infinite alternate;
      }

      @keyframes pulseGlow {
        0% {
          transform: scale(1);
          box-shadow:
            0 0 18px rgba(59, 231, 255, 0.25),
            0 0 40px rgba(90, 139, 255, 0.15),
            inset 0 0 15px rgba(59, 231, 255, 0.08);
        }
        100% {
          transform: scale(1.02);
          box-shadow:
            0 0 24px rgba(59, 231, 255, 0.55),
            0 0 60px rgba(179, 93, 255, 0.2),
            inset 0 0 28px rgba(59, 231, 255, 0.12);
        }
      }

      @keyframes sweep {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(120%);
        }
      }

      @keyframes flicker {
        0%, 18%, 22%, 24%, 26%, 52%, 57%, 100% {
          opacity: 1;
          filter: brightness(1);
        }
        20%, 23%, 25%, 53%, 55% {
          opacity: 0.75;
          filter: brightness(1.2);
        }
      }

      @media (max-width: 480px) {
        .clock {
          padding: 1.5rem 1.3rem;
          min-width: 280px;
        }

        #date {
          letter-spacing: 0.18rem;
          font-size: 0.7rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="clock">
      <p id="date"></p>
      <p id="time"></p>
    </div>

    <script>
      const semana = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

      function updateTime() {
        const now = new Date();
        document.getElementById("time").innerText =
          zeroPadding(now.getHours(), 2) +
          ":" +
          zeroPadding(now.getMinutes(), 2) +
          ":" +
          zeroPadding(now.getSeconds(), 2);

        document.getElementById("date").innerText =
          zeroPadding(now.getDate(), 2) +
          "-" +
          zeroPadding(now.getMonth() + 1, 2) +
          "-" +
          now.getFullYear() +
          " " +
          semana[now.getDay()];
      }

      updateTime();
      setInterval(updateTime, 1000);

      function zeroPadding(num, digit) {
        return String(num).padStart(digit, '0');
      }
    </script>
  </body>
</html>
