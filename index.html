<!DOCTYPE>
<style>
  div {
    border-top: 200px;
    text-align: center;
    align-items: center;
  }

  #date {
    color: fuchsia;
    border-top: 100px;
  }
</style>
<div class="clock">
  <p id="date"></p>
  <p id="time"></p>
</div>


<script>
  const semana = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex"];

  function updateTime() {
    var now = new Date();
    const semana = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex"];
    document.getElementById("time").innerText = zeroPadding(now.getHours(), 2) + ":" + zeroPadding(now.getMinutes(), 2) + ":" + zeroPadding(now.getSeconds(), 2);
    document.getElementById("date").innerText = zeroPadding(now.getDate(), 2) + "-" + zeroPadding(now.getMonth() + 1, 2) + "-" + now.getFullYear() + " " + semana[now.getDay()];
  }
  updateTime();
  setInterval(updateTime, 1000);

  function zeroPadding(num, digit) {
    return String(num).padStart(digit, '0');
  } 
</script>
